name: Pull Requests


on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches:
      - "renovate/**"


concurrency:
  group: "Pull Requests: ${{ github.workflow }} @ ${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true


jobs:

  tests:
    uses: ./.github/workflows/run_tests.yml
    permissions:
      contents: read
      checks: write
