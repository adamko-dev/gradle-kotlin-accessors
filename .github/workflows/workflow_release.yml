name: Releases


on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
  push:
    branches: [ main ]
    # A `vX.Y.Z` tag is what produces a release version -- see CONTRIBUTING.md.
    tags: [ "v*" ]


concurrency:
  group: "Releases: ${{ github.workflow }} @ ${{ inputs.checkout-ref }} ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: false


jobs:

  tests:
    uses: ./.github/workflows/run_tests.yml
    permissions:
      checks: write
      contents: read
    with:
      checkout-ref: ${{ inputs.checkout-ref }}

  publish-maven:
    needs: tests
    # only publish when manually triggered, or it's the main branch, or it's for a release tag
    if: inputs.checkout-ref || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/run_publish_maven.yml
    secrets: inherit
    permissions:
      checks: write
      contents: read
    with:
      checkout-ref: ${{ inputs.checkout-ref }}